name: graviton
description: "A physics simulation exploring gravitational dynamics and orbital mechanics."
publish_to: "none"
version: 1.7.0+24
repository: https://github.com/Chipper-Technologies/graviton
license: MIT

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cloud_firestore: ^6.1.2
  cupertino_icons: ^1.0.8
  file_picker: ^10.3.8
  firebase_analytics: ^12.1.1
  firebase_app_check: ^0.4.1+4
  firebase_auth: ^6.1.4
  firebase_core: ^4.4.0
  firebase_crashlytics: ^5.0.7
  firebase_database: ^12.1.2
  firebase_performance: ^0.11.1+4
  firebase_remote_config: ^6.1.4
  flutter_svg: ^2.2.3
  google_sign_in: ^7.2.0
  http: ^1.6.0
  package_info_plus: ^9.0.0
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  purchases_flutter: ^9.10.7
  share_plus: ^12.0.1
  shared_preferences: ^2.5.4
  sign_in_with_apple: ^7.0.1
  sliding_up_panel: ^2.0.0+1
  url_launcher: ^6.3.2
  vector_math: ^2.2.0
  vibration: ^3.1.5

dev_dependencies:
  build_runner: ^2.10.5
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_lints: ^6.0.0
  mockito: ^5.6.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/

flutter_launcher_icons:
  adaptive_icon_background: "assets/images/app-logo-bg.png"
  adaptive_icon_foreground: "assets/images/graviton-logo-transparent.png"
  android: true
  ios: true
  macos:
    generate: true
    image_path: "assets/images/app-logo.png"
  image_path: "assets/images/app-logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0e091c"
  image: "assets/images/graviton-logo-transparent.png"
  color_dark: "#0e091c"
  image_dark: "assets/images/graviton-logo-transparent.png"
  android_gravity: center
  ios_content_mode: scaleAspectFit
  fullscreen: false
  web: true
